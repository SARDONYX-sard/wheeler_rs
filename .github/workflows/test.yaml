name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every action (also inside .github/actions/*) must be pinned in actions.lock.
  # After changing any `uses:`, run `gh actions-lock` and commit the lockfile.
  actions-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/gh-actions-lock@verify/v0.5.1

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-rust
      # default-members is only the DLL crate, so test the whole workspace.
      - run: cargo test --workspace --locked

  ub-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-rust
        with:
          toolchain: nightly
          components: miri
          cache-key: miri
      - run: cargo miri setup
      # Only wheeler_core: the other crates call C/OS code (Dear ImGui, D3D11,
      # the game) that Miri cannot execute.
      - run: cargo miri test -p wheeler_core --locked
