[workspace.package]
authors      = ["SARDONYX"]
categories   = ["game-development"]
description  = "Wheeler (quick-access wheel menu) for Skyrim, written in Rust"
edition      = "2024"
keywords     = ["skyrim", "skse"]
license      = "MIT OR Apache-2.0"
readme       = "readme.md"
repository   = "https://github.com/SARDONYX-sard/wheeler_re"
rust-version = "1.88"
version      = "0.1.0"

[workspace]
members         = ["crates/*", "xtask"]
default-members = ["crates/wheeler_re"]
resolver        = "3"

[workspace.dependencies]
# libskyrim = { git = "https://github.com/SARDONYX-forks/CommonLib-SkyrimLib.git", rev = "09b364f", features = ["se", "ae"] }
libskyrim = { path = "../CommonLib-SkyrimLib/libskyrim", features = ["se", "ae"] }

imgui = "0.12.0"
resvg = { version = "0.45.1", default-features = false }
rex_com = { path = "../CommonLib-SkyrimLib/rex_com" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
snafu = "0.8.5" # xtask

# Dev dependencies
pretty_assertions = "1.4.1" # Color diff assertion

[workspace.dependencies.windows-sys]
version  = "0.61.2"
features = []

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = 3
strip         = true

[profile.dev]
panic = "abort"
